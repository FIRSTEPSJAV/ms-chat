name: Build and Deploy with MicroK8s

on:
  # workflow_dispatch:
  #   inputs:
  #     image_tag:
  #       description: 'Tag de la imagen (ej: v1.0.0, latest)'
  #       required: true
  #       default: 'latest'
  push:
    branches: [dev]

jobs:
  build-and-publish:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Convertir a minúsculas el owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ env.OWNER_LC }}/ms-chat:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ env.OWNER_LC }}/ms-chat:latest

      - name: Print pushed image URL
        run: echo "Imagen publicada:ghcr.io/${{ env.OWNER_LC }}/ms-chat:latest"
  deploy-onpremise:
    name: Deploy on MicroK8s On-Premise
    runs-on: dev
    needs: build-and-publish

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Apply Kubernetes deployment
        run: sudo microk8s kubectl apply -f k8s/dev/deploymentservice.yaml
      - name: Apply Kubernetes ingress
        run: sudo microk8s kubectl apply -f k8s/dev/ingress.yaml
      - name: Restart Kubernetes deployment
        run: sudo microk8s kubectl rollout restart deployment/ms-chat -n firsteps-dev

