apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-chat
  namespace: firsteps-dev
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "ms-chat"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: "cookie"
spec:
  ingressClassName: public
  rules:
  - host: firstepscol.com
    http:
      paths:
      - path: /api/ms-chat
        pathType: Prefix
        backend:
          service:
            name: ms-chat
            port:
              number: 8086
